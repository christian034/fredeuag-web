<app-site-nav></app-site-nav>

<ng-container *ngIf="(noticia$ | async) as noticia; else noEncontrada">
  <main class="bg-base text-bone">
    <!-- Imagen de cabecera a lo ancho de la página -->
    <div class="relative h-[45vh] min-h-[280px] w-full overflow-hidden">
      <img [src]="noticia.imagen" [alt]="noticia.imagenAlt" class="absolute inset-0 w-full h-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-black/10"></div>
      <div class="absolute bottom-0 left-0 right-0 p-6 md:p-16">
        <p class="text-accent text-sm font-medium mb-2 tracking-wide">{{ noticia.fecha }}</p>
        <h1 class="text-white font-display text-3xl md:text-5xl font-medium leading-tight max-w-4xl">
          {{ noticia.titulo }}
        </h1>
      </div>
    </div>

    <div class="relative isolate px-4 sm:px-6 md:px-16 py-10 md:py-14">
      <app-fondo-publico></app-fondo-publico>
      <a routerLink="/noticias" class="text-muted hover:text-accent text-sm inline-block mb-8">← Volver a noticias</a>

      <div class="w-full border border-line bg-surface p-6 md:p-10">
        <p class="text-muted text-base md:text-lg leading-relaxed mb-6">{{ noticia.resumen }}</p>

        <div
          *ngIf="noticia.cuerpoHtml"
          class="contenido-noticia text-bone text-base leading-relaxed [&_h2]:text-xl [&_h2]:font-medium [&_h2]:font-display [&_h2]:mt-6 [&_h2]:mb-3 [&_ul]:list-disc [&_ul]:pl-5 [&_table]:border-collapse [&_table]:w-full [&_table]:my-4 [&_td]:border [&_td]:border-line [&_td]:p-2 [&_th]:border [&_th]:border-line [&_th]:p-2 [&_img]:max-w-full [&_img]:h-auto [&_p]:mb-4"
          [innerHTML]="cuerpoSeguro(noticia.cuerpoHtml)"
        ></div>

        <div *ngIf="noticia.videoUrl && embed(noticia.videoUrl) as urlSegura" class="mt-8 aspect-video max-w-3xl">
          <iframe
            [src]="urlSegura"
            class="w-full h-full"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>

        <div *ngIf="encuestaVotable(noticia) as encuesta" class="mt-10 max-w-xl">
          <app-encuesta-publica [seccion]="encuesta"></app-encuesta-publica>
        </div>
      </div>
    </div>
  </main>
</ng-container>

<app-site-footer *ngIf="(contenido$ | async) as contenido" [redes]="contenido.contacto"></app-site-footer>

<ng-template #noEncontrada>
  <main class="bg-base min-h-screen flex flex-col items-center justify-center px-6 text-center text-bone">
    <p class="font-display text-2xl font-medium mb-3">No encontramos esta noticia</p>
    <a routerLink="/noticias" class="text-accent hover:underline text-sm">Volver a noticias</a>
  </main>
</ng-template>
