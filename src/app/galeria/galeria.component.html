<app-site-nav></app-site-nav>

<main class="relative isolate bg-base min-h-screen text-bone overflow-hidden" *ngIf="(contenido$ | async) as contenido">
  <app-fondo-publico></app-fondo-publico>

  <div class="relative px-6 md:px-16 py-14" *ngIf="(vista$ | async) as vista">
    <p class="text-accent text-sm font-medium mb-2 tracking-wide">Galería</p>
    <h1
      class="font-display text-3xl md:text-4xl font-medium mb-10"
      [class.text-white]="tema.oscuroActivo()"
      [style.color]="tema.oscuroActivo() ? null : '#202054'"
    >Imágenes del movimiento</h1>

    <!-- Foto destacada: a todo el ancho de la página -->
    <button
      *ngIf="vista.destacada as destacada"
      type="button"
      (click)="abrirLightbox(vista.todas, destacada)"
      class="group relative w-full mb-10 border border-line bg-surface overflow-hidden rounded-2xl block text-left"
    >
      <div class="overflow-hidden rounded-2xl">
        <img [src]="destacada.url" [alt]="destacada.descripcion" class="w-full h-72 md:h-[28rem] object-cover transition-transform duration-700 group-hover:scale-105" />
      </div>
      <figcaption class="p-4 text-sm text-muted flex items-center gap-2">
        <span class="text-accent">★</span> {{ destacada.descripcion }}
      </figcaption>
    </button>

    <!-- Resto de las fotos: rectangulares, esquinas redondeadas -->
    <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-4 max-w-5xl">
      <button
        *ngFor="let foto of vista.resto"
        type="button"
        (click)="abrirLightbox(vista.todas, foto)"
        class="group bg-surface border border-line overflow-hidden rounded-2xl transition-all duration-300 hover:border-accent hover:-translate-y-1 hover:shadow-xl text-left"
      >
        <div class="overflow-hidden rounded-2xl">
          <img [src]="foto.url" [alt]="foto.descripcion" class="w-full aspect-[4/3] object-cover transition-transform duration-500 group-hover:scale-110" />
        </div>
        <figcaption class="p-3 text-sm text-muted transition-colors duration-300 group-hover:text-accent">{{ foto.descripcion }}</figcaption>
      </button>
    </div>

    <p *ngIf="!vista.hayFotos" class="text-muted">Aún no se han agregado fotos.</p>

    <!-- Lightbox: vista ampliada con navegación -->
    <div *ngIf="indiceAbierto !== null" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center px-4" (click)="cerrarLightbox()">
      <button type="button" (click)="cerrarLightbox()" class="absolute top-4 right-4 text-white/80 hover:text-white text-3xl leading-none" aria-label="Cerrar">✕</button>

      <button
        type="button"
        (click)="anterior(vista.todas); $event.stopPropagation()"
        class="absolute left-2 md:left-6 text-white/70 hover:text-white text-4xl leading-none px-2"
        aria-label="Foto anterior"
      >‹</button>

      <img [src]="vista.todas[indiceAbierto!].url" [alt]="vista.todas[indiceAbierto!].descripcion" class="max-h-[85vh] max-w-[90vw] object-contain rounded-lg" (click)="$event.stopPropagation()" />

      <button
        type="button"
        (click)="siguiente(vista.todas); $event.stopPropagation()"
        class="absolute right-2 md:right-6 text-white/70 hover:text-white text-4xl leading-none px-2"
        aria-label="Siguiente foto"
      >›</button>

      <p class="absolute bottom-6 left-0 right-0 text-center text-white/80 text-sm px-10">{{ vista.todas[indiceAbierto!].descripcion }}</p>
    </div>
  </div>
</main>

<app-site-footer *ngIf="(contenido$ | async) as contenido" [redes]="contenido.contacto"></app-site-footer>
