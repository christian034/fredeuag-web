<app-site-nav></app-site-nav>

<main class="relative isolate bg-base min-h-screen px-4 sm:px-6 md:px-16 py-10 md:py-14 text-bone">
  <app-fondo-publico></app-fondo-publico>
  <p class="text-accent text-sm font-medium mb-2 tracking-wide">Actualizaciones</p>
  <h1 class="font-display text-3xl md:text-4xl font-medium mb-8 md:mb-10">Noticias del movimiento</h1>

  <div *ngIf="(contenido$ | async) as contenido" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6">
    <a
      *ngFor="let noticia of contenido.noticias"
      [routerLink]="['/noticias', noticia.id]"
      class="group bg-surface border border-line overflow-hidden hover:border-accent transition-all duration-300 block hover:-translate-y-1 hover:shadow-xl"
    >
      <div class="overflow-hidden">
        <img [src]="noticia.imagen" [alt]="noticia.imagenAlt" class="w-full h-48 object-cover transition-transform duration-500 group-hover:scale-110" />
      </div>
      <div class="p-5 md:p-6">
        <p class="text-accent text-xs font-medium mb-2 tracking-wide">{{ noticia.fecha }}</p>
        <h2 class="font-display text-lg md:text-xl font-medium mb-2 group-hover:text-accent transition-colors">{{ noticia.titulo }}</h2>
        <p class="text-muted text-sm leading-relaxed">{{ noticia.resumen }}</p>
        <span class="inline-block text-accent text-sm mt-3 transition-transform duration-300 group-hover:translate-x-1">Leer más →</span>
      </div>
    </a>
  </div>
</main>

<app-site-footer *ngIf="(contenido$ | async) as contenido" [redes]="contenido.contacto"></app-site-footer>
